name: rideguard
description: RideGuard school-bus safety app.
publish_to: "none"
version: 0.1.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.1
  device_info_plus: ^11.3.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^19.4.0
  flutter_blue_plus: ^1.35.5
  flutter_map: ^8.3.2
  geolocator: ^13.0.4
  latlong2: ^0.9.1
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  crypto: ^3.0.6
  open_filex: ^4.7.0
  connectivity_plus: ^7.3.1
  android_intent_plus: ^6.1.0
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_extended.png
